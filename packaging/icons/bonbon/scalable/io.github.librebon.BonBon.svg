<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD0DB"/>
      <stop offset="42%" stop-color="#F7B3C4"/>
      <stop offset="100%" stop-color="#EE9AAD"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3C0CC"/>
      <stop offset="100%" stop-color="#D8899A"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="10" dy="12" in="SourceAlpha" result="off"/>
      <feGaussianBlur stdDeviation="0.6" in="off" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.42  0 0 0 0 0.16  0 0 0 0 0.22  0 0 0 0.85 0" result="tint"/>
      <feMerge>
        <feMergeNode in="tint"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer tile -->
  <rect x="28" y="28" width="456" height="456" rx="118" ry="118" fill="url(#edge)"/>
  <rect x="40" y="40" width="432" height="432" rx="108" ry="108" fill="url(#face)"/>
  <!-- Top gloss -->
  <path fill="url(#gloss)" d="M148,52 C90,52 48,96 48,160 C48,230 90,270 160,270 C250,270 300,200 464,118 C464,80 430,52 364,52 Z"/>
  <!-- Bn -->
  <text x="256" y="348" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif"
        font-size="230" font-weight="700" fill="#FFFFFF" filter="url(#shadow)">Bn</text>
</svg>
